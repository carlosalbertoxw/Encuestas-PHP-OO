name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: encuestas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Lint de sintaxis
        run: |
          find src public bin tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "Sintaxis correcta"

      - name: Validar composer.json y composer.lock
        run: composer validate --strict

      - name: Instalar dependencias
        run: composer install --no-progress --prefer-dist

      - name: Auditar dependencias vulnerables
        run: composer audit

      - name: Análisis estático (PHPStan nivel 8)
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --no-progress

      - name: Estilo de código (PSR-12)
        run: vendor/bin/phpcs

      - name: Pruebas (unitarias + integración y HTTP E2E contra MySQL 8.4)
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_DATABASE: encuestas_test
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit

  # Construye la imagen de producción y la escanea en busca de vulnerabilidades.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t encuestas-php:${{ github.sha }} .

      - name: Escanear la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: encuestas-php:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # Análisis estático de seguridad (SAST). CodeQL no analiza PHP; Semgrep sí.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Analizar con Semgrep
        run: semgrep scan --config p/php --config p/security-audit --error --metrics=off --exclude vendor
