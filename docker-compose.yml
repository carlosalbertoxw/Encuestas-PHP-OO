# Aplicación web + MySQL 8.4 + Mailpit, con contenedores y volumen propios. Los
# puertos del host (BD en 3307 y web en 8081 por defecto) evitan choques con
# otros servicios locales y se personalizan vía .env.
services:
  db:
    image: mysql:8.4
    container_name: encuestas-php-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-encuestas}
      MYSQL_USER: ${MYSQL_USER:-encuestas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-encuestas}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    # El esquema lo aplican las migraciones al arrancar la aplicación
    # (migrations/); el contenedor solo crea la base vacía.
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de pruebas: captura todos los correos y los muestra en http://localhost:8026.
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: encuestas-php-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encuestas-php-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # La app se conecta al contenedor de MySQL por el nombre del servicio (db).
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-encuestas}
      DB_USERNAME: ${MYSQL_USER:-encuestas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-encuestas}
      APP_ENV: ${APP_ENV:-production}
      # Clave de firma de tokens: obligatoria, sin valor por defecto (ver .env.example).
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env, por ejemplo con openssl rand -hex 32}
      # URL pública con la que se construyen los enlaces de los correos.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      # Proxies inversos de confianza y redirección a HTTPS (ver .env.example).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    ports:
      - "${WEB_PORT:-8081}:8080"
    # El HEALTHCHECK de la imagen consulta /health/live; /health/ready comprueba además la BD.

volumes:
  db-data:
